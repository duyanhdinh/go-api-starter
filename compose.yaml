services:
  api:
    image: go-api-starter:${IMAGE_TAG:-local}
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DOCS_ENABLED: ${DOCS_ENABLED:-}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-}
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS_PER_SECOND: ${RATE_LIMIT_REQUESTS_PER_SECOND:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
      RATE_LIMIT_MAX_CLIENTS: ${RATE_LIMIT_MAX_CLIENTS:-}
      RATE_LIMIT_ENTRY_TTL: ${RATE_LIMIT_ENTRY_TTL:-}
      DB_ENABLED: ${DB_ENABLED:-false}
      DB_PROVIDER: ${DB_PROVIDER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-}
      DB_PING_TIMEOUT: ${DB_PING_TIMEOUT:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      HTTP_ADDR: ":8080"
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-}
      HTTP_CLIENT_TIMEOUT: ${HTTP_CLIENT_TIMEOUT:-}
      HTTP_CLIENT_CONNECT_TIMEOUT: ${HTTP_CLIENT_CONNECT_TIMEOUT:-}
      HTTP_CLIENT_TLS_HANDSHAKE_TIMEOUT: ${HTTP_CLIENT_TLS_HANDSHAKE_TIMEOUT:-}
      HTTP_CLIENT_RESPONSE_HEADER_TIMEOUT: ${HTTP_CLIENT_RESPONSE_HEADER_TIMEOUT:-}
      HTTP_CLIENT_IDLE_CONN_TIMEOUT: ${HTTP_CLIENT_IDLE_CONN_TIMEOUT:-}
      HTTP_CLIENT_MAX_IDLE_CONNS: ${HTTP_CLIENT_MAX_IDLE_CONNS:-}
      HTTP_CLIENT_MAX_IDLE_CONNS_PER_HOST: ${HTTP_CLIENT_MAX_IDLE_CONNS_PER_HOST:-}
      HTTP_CLIENT_MAX_CONNS_PER_HOST: ${HTTP_CLIENT_MAX_CONNS_PER_HOST:-}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
