name: OpenAPI contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate OpenAPI and references
        run: go run ./cmd/openapi-validate
      - name: Test API contract and docs config
        run: go test ./cmd/api ./internal/platform/config -run 'Test(APIContract|Contract|Docs|Profiles|EnvironmentOverrides|InvalidConfiguration)'
